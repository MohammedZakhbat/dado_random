<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Dado Aleatorio</title>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4 overflow-y-auto">

    <div
        class="w-full max-w-md bg-white/90 backdrop-blur-lg rounded-[32px] shadow-2xl p-6 sm:p-8 flex flex-col items-center">

        <div
            class="w-20 h-20 rounded-3xl bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg mb-5">
            <span class="text-4xl">🎲</span>
        </div>

        <h1 class="text-3xl sm:text-4xl font-black text-gray-800 text-center">
            Lanzar el Dado
        </h1>

        <p class="text-gray-500 text-center mt-2 text-sm sm:text-base">
            Presiona el botón y descubre tu número aleatorio
        </p>

        <div
            class="mt-8 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-3xl p-6 w-full flex justify-center shadow-inner">

            <img id="dado" src="./img/Dice-1.svg"
                class="w-32 h-32 sm:w-40 sm:h-40 object-contain transition duration-300">

        </div>

        <button onclick="tirarDado()"
            class="mt-8 w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 hover:scale-105 transition-all duration-300 text-white font-bold text-lg py-4 rounded-2xl shadow-xl">
            🎲 Lanzar Ahora
        </button>

    </div>

    <script src="app.js"></script>

</body>

</html>
